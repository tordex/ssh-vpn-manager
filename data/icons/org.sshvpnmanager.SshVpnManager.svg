<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Градиент фона (глубокий dark slate) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e222d" />
      <stop offset="100%" stop-color="#0f1117" />
    </linearGradient>

    <!-- Градиент акцента (кибер-бирюзовый / неоновый) -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Свечение щита/терминала -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Внутренний градиент щита -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a3245" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#141824" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Базовая плашка (Squircle) -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" />
  <rect x="32" y="32" width="448" height="448" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" />

  <!-- Внешний защитный контур (VPN Shield) -->
  <path d="M 256 100 
           C 330 130 380 138 380 138 
           C 380 270 320 360 256 404 
           C 192 360 132 270 132 138 
           C 132 138 182 130 256 100 Z" fill="url(#shieldGrad)" stroke="url(#accentGrad)" stroke-width="8" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Внутренний терминальный шелл: Prompt `>_` (SSH) -->
  <!-- Символ '>' -->
  <path d="M 200 210 L 250 252 L 200 294" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Курсор '_' -->
  <line x1="270" y1="294" x2="314" y2="294" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round" />

  <!-- Индикатор активного туннеля / узла (Сетевой статус) -->
  <circle cx="256" cy="356" r="8" fill="#00f2fe" />
  <circle cx="256" cy="356" r="16" fill="none" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.4" />
</svg>