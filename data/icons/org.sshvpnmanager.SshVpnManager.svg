<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Градиент тела щита -->
    <linearGradient id="shield-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141a29" />
      <stop offset="55%" stop-color="#0d111a" />
      <stop offset="100%" stop-color="#080a10" />
    </linearGradient>

    <!-- Градиент контура щита -->
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5cedff" />
      <stop offset="45%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#0088ff" />
    </linearGradient>

    <!-- Градиент индикатора -->
    <radialGradient id="dot-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6df5ff" />
      <stop offset="60%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#0099cc" />
    </radialGradient>
  </defs>

  <!-- Тело щита -->
  <path d="M 256,12
           C 348,51 436,41 486,60
           C 496,187 457,378 256,500
           C 55,378 16,187 26,60
           C 76,41 164,51 256,12 Z" fill="url(#shield-body)" />

  <!-- Четкая окантовка щита без размытия -->
  <path d="M 256,12
           C 348,51 436,41 486,60
           C 496,187 457,378 256,500
           C 55,378 16,187 26,60
           C 76,41 164,51 256,12 Z" fill="none" stroke="url(#neon-cyan)" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" />

  <!-- Внутренний тонкий контур для объема -->
  <path d="M 256,26
           C 342,63 423,53 469,71
           C 478,187 442,363 256,479
           C 70,363 34,187 43,71
           C 89,53 170,63 256,26 Z" fill="none" stroke="#5cedff" stroke-width="1.5" opacity="0.3" />

  <!-- Символ консоли (SSH промпт ">") -->
  <path d="M 196,216
           L 270,285
           L 196,354" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Нижний LED-индикатор статуса соединения -->
  <g transform="translate(256, 428)">
    <!-- Внешнее кольцо -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="url(#neon-cyan)" stroke-width="4.5" opacity="0.85" />
    <!-- Фоновая подложка -->
    <circle cx="0" cy="0" r="14" fill="#080a10" />
    <!-- Индикатор -->
    <circle cx="0" cy="0" r="10" fill="url(#dot-glow)" />
  </g>
</svg>